<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSA · no hay nada aquí</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
    @font-face {
        font-family: 'Array-Wide';
        src: url('/fonts/Array-Wide.woff2') format('woff2'),
             url('/fonts/Array-Wide.woff') format('woff');
        font-weight: 400;
        font-display: swap;
    }
    @font-face {
        font-family: 'Array-Bold';
        src: url('/fonts/Array-Bold.woff2') format('woff2'),
             url('/fonts/Array-Bold.woff') format('woff');
        font-weight: 700;
        font-display: swap;
    }
    @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Regular.woff2') format('woff2'),
             url('/fonts/Geist-Regular.woff') format('woff');
        font-weight: 400;
        font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background:
            radial-gradient(70% 45% at 50% 12%, rgba(255,57,11,0.16), transparent 60%),
            #0d0d0d;
        color: #fff;
        font-family: 'Geist', sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
    }

    .logo-mark {
        width: 40px;
        height: 43px;
        background-color: #ff390b;
        -webkit-mask-image: url('/LOGO_blanco.png');
        mask-image: url('/LOGO_blanco.png');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        margin-bottom: 2.2rem;
    }

    .code {
        font-family: 'Array-Wide', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        color: #666;
        text-transform: uppercase;
        margin-bottom: 1.1rem;
    }

    h1 {
        font-family: 'Array-Bold', sans-serif;
        font-size: clamp(1.3rem, 5.5vw, 1.9rem);
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
    }

    p {
        font-size: 0.9rem;
        color: #999;
        line-height: 1.65;
        max-width: 320px;
        margin-bottom: 2.6rem;
    }

    .home {
        font-family: 'Array-Wide', sans-serif;
        display: inline-block;
        background: #ff390b;
        color: #fff;
        text-decoration: none;
        padding: 0.85rem 2rem;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: background 0.2s;
    }
    .home:hover { background: #ff5a2e; }
</style>
</head>
<body>

    <div class="logo-mark"></div>

    <p class="code">Error 404</p>

    <h1>Aquí no hay nada</h1>

    <p>Esta página no existe, o cambió de sitio. Vuelve al principio y sigue desde ahí.</p>

    <a class="home" href="index.html">Volver al principio</a>

</body>
</html>
